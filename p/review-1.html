<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Drum pages (private)</title>
<style>
  body { font: 16px/1.5 -apple-system, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; color: #222; background: #f6f6f4; }
  form { width: min(360px, 86vw); }
  h1 { font-size: 20px; margin: 0 0 12px; }
  input, button { font: inherit; width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #bbb; }
  button { margin-top: 10px; background: #222; color: #fff; border-color: #222; }
  p { color: #a22; min-height: 1.5em; margin: 8px 0 0; }
</style></head><body>
<form id="f"><h1>Drum pages (private)</h1>
<input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
<button>Open</button><p id="msg"></p></form>
<script>
const SALT = "QMMPazwl3ikSv9qHTWPcCQ==", IV = "UajrPFJXe9zC7ZmuZ1CDuw==", MAC = "9G+nZD/wqt6uGVTfkENgX1tTRtc+gb2l95Is/ExRE5E=", ROUNDS = 600000;
const bytes = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
async function unlock(password) {
  const data = bytes(document.getElementById("data").textContent.trim());
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(SALT), iterations: ROUNDS }, base, 512));
  const macKey = await crypto.subtle.importKey("raw", bits.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
  const iv = bytes(IV), signed = new Uint8Array(iv.length + data.length);
  signed.set(iv); signed.set(data, iv.length);
  if (!await crypto.subtle.verify("HMAC", macKey, bytes(MAC), signed)) return null;
  const key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-CBC", iv }, key, data));
}
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "Opening…";
  try {
    const html = await unlock(document.getElementById("pw").value.trim());
    if (html === null) { msg.textContent = "Wrong password."; return; }
    document.open(); document.write(html); document.close();
  } catch (err) { msg.textContent = "Could not open the page in this browser."; }
};
</script>
